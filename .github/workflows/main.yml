name: XAUUSD AI Deriv Bot Runner

on:
  schedule:
    # Berjalan otomatis setiap 5 menit dari Senin sampai Jumat (UTC)
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # Bisa ditrigger manual juga

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run XAUUSD Snapshot Engine
      env:
        DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
        DERIV_API_TOKEN: ${{ secrets.DERIV_API_TOKEN }}
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: |
        python main.py
