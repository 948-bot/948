name: XAUUSD Deriv Quant Bot V9 Hybrid

on:
  workflow_dispatch:
  schedule:
    # Jalan tiap 15 menit pas jam market aktif
    # Senin-Jumat 00,15,30,45 * jam 1-23 UTC = 08:00 - 06:00 WIB
    - cron: '0,15,30,45 * * * 1-5'
    # Weekend tetap jalan 6 jam sekali buat evaluasi PAXG
    - cron: '0 */6 * * 0,6'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Restore DNA & Memory (Cache FIX biar gak reset)
        uses: actions/cache@v4
        with:
          path: |
            .dna_tani_v9.json
            .memory_tani_v9.json
            .last_tani_v9.json
            .offset_history.json
            .dna_tani_v8.json
            .memory_tani_v8.json
            .last_tani_v8.json
          key: tani-dna-v9-static-cache
          restore-keys: |
            tani-dna-v9-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websocket-client requests pandas numpy

      - name: Run Trading Bot V9 Hybrid
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DERIV_APP_ID: ${{ secrets.DERIV_APP_ID }}
          # Support nama lama juga
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python main.py

      - name: Save logs if failed
        if: failure()
        run: |
          echo "Bot failed, cek log di atas"
          cat bot.log || echo "No log file"
